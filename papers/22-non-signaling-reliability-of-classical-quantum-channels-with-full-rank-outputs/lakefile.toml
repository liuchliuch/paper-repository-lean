name = "paper22"
version = "0.1.0"
defaultTargets = ["Paper22"]

[[lean_lib]]
name = "Paper22"
globs = ["Paper22"]
moreLeanArgs = ["-DautoImplicit=false"]

[[lean_lib]]
name = "Paper"
roots = ["Paper.Statements", "Paper.Proofs"]
moreLeanArgs = ["-DautoImplicit=false"]

[[lean_lib]]
name = "PaperChallenge"
roots = ["Paper.Challenge"]
moreLeanArgs = ["-DautoImplicit=false"]

[[lean_lib]]
name = "PaperNegativePremise"
roots = ["Paper.NegativePremise"]
moreLeanArgs = ["-DautoImplicit=false"]

[[lean_lib]]
name = "PaperNegativeAxiom"
roots = ["Paper.NegativeAxiom"]
moreLeanArgs = ["-DautoImplicit=false"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f897ebcf72cd16f89ab4577d0c826cd14afaafc7"
