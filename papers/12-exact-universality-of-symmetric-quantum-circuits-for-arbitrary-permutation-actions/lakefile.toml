name = "Paper12"
version = "0.1.0"
defaultTargets = ["Paper12"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f897ebcf72cd16f89ab4577d0c826cd14afaafc7"

[[lean_lib]]
name = "Paper12"
globs = ["Paper12"]

[[lean_lib]]
name = "PaperStatements"
roots = ["Paper12.Statements"]

[[lean_lib]]
name = "PaperChallenge"
roots = ["Paper12.Challenge"]

[[lean_lib]]
name = "PaperProofs"
