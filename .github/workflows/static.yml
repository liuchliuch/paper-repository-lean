name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Source structure and tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test shared tooling without Lean execution
        run: python3 -m unittest discover -s tests -v
      - name: Check every declared paper interface
        run: python3 scripts/verify.py --check static
      - name: Check README paper index
        run: python3 scripts/catalog.py --check
